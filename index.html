<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Approval ERP Dynamic</title>
	<link rel="stylesheet" href="style.css">
</head>
	<body>
		<div class="login-wrap">
			<div class="login-box">
				<h2>📦 Approval ERP</h2>
					<small style="display:block;text-align:center;color:#94a3b8;margin-bottom:20px">V6 Dynamic - Login</small>
	<div style="margin-bottom:12px">
		<label>User ID</label>
		<input id="loginUser">
	</div>
	<div style="margin-bottom:12px">
		<label>Password</label>
		<input type="password" id="loginPass">
	</div>
	<button style="background:#3b82f6;width:100%;padding:12px" onclick="doLogin()">Login</button>
	<div style="margin-top:15px;background:#0f172a;padding:10px;border-radius:6px;font-size:11px;color:#94a3b8">Admin: <b>admin / admin123</b><br>User: <b>user1 / user123</b>
	<br>
	</div>
					<div id="loginError" style="color:#dc2626;font-size:12px;margin-top:10px;text-align:center;display:none"></div>
				</div>
			</div>
		<script src="auth.js"></script>
	</body>
</html>
